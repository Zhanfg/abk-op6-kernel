name: Build Standard

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-standard.yml"
      - ".github/workflows/build-kernel.yml"
      - "scripts/powersave_defconfig.patch"
      - "scripts/validate_kernel_source.sh"
      - "tests/test_build_contract.sh"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-kernel.yml
    with:
      mode: Standard
      bakasu_sha: 516d3e87fbc986ccefdde2c2765f1700612441a9
