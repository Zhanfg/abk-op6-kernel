name: OP6 AOSP17 Preflight

on:
  push:
    branches:
      - prep/android17-gki-rom
    paths:
      - 'manifests/**'
      - 'scripts/audit-los-identity.sh'
      - '.github/workflows/op6-aosp17-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4

      - name: Validate local-manifest XML
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          files = [
              pathlib.Path('manifests/op6-aosp17.xml'),
              pathlib.Path('manifests/op6-qcom-bridge.xml'),
              pathlib.Path('manifests/op6-reference.xml'),
          ]
          for path in files:
              root = ET.parse(path).getroot()
              assert root.tag == 'manifest', f'{path}: root must be <manifest>'
              print(f'OK XML: {path}')
          PY

      - name: Verify active manifest refs exist
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifests = [Path('manifests/op6-aosp17.xml'), Path('manifests/op6-qcom-bridge.xml')]
          failures = []

          for manifest in manifests:
              root = ET.parse(manifest).getroot()
              remotes = {r.attrib['name']: r.attrib['fetch'] for r in root.findall('remote')}
              for project in root.findall('project'):
                  name = project.attrib['name']
                  remote = project.attrib['remote']
                  rev = project.attrib.get('revision')
                  if not rev:
                      failures.append(f'{manifest}: {name}: missing explicit revision')
                      continue
                  fetch = remotes[remote]
                  url = f"{fetch.rstrip('/')}/{name}.git"
                  ref = rev if rev.startswith('refs/') else f'refs/heads/{rev}'
                  result = subprocess.run(
                      ['git', 'ls-remote', '--exit-code', url, ref],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
                  if result.returncode:
                      failures.append(f'{manifest}: missing {url} {ref}: {result.stderr.strip()}')
                  else:
                      print(f'OK REF: {name}@{rev}')

          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Assemble active source audit tree
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/aosp"
          mkdir -p \
            "$ROOT/device/oneplus" \
            "$ROOT/hardware"

          git clone --depth=1 --branch bringup/aosp17 \
            https://github.com/Zhanfg/android_device_oneplus_enchilada.git \
            "$ROOT/device/oneplus/enchilada"
          git clone --depth=1 --branch bringup/aosp17 \
            https://github.com/Zhanfg/android_device_oneplus_sdm845-common.git \
            "$ROOT/device/oneplus/sdm845-common"
          git clone --depth=1 --branch bringup/aosp17 \
            https://github.com/Zhanfg/android_hardware_oneplus.git \
            "$ROOT/hardware/oneplus"

          bash scripts/audit-los-identity.sh "$ROOT"

      - name: Check product base invariants
        shell: bash
        run: |
          ENCHILADA="$RUNNER_TEMP/aosp/device/oneplus/enchilada"
          COMMON="$RUNNER_TEMP/aosp/device/oneplus/sdm845-common"

          grep -Fq 'PRODUCT_NAME := aosp_enchilada' "$ENCHILADA/aosp_enchilada.mk"
          ! grep -RInF 'vendor/lineage/config' \
              "$ENCHILADA/AndroidProducts.mk" \
              "$ENCHILADA/aosp_enchilada.mk" \
              "$ENCHILADA/device.mk"
          grep -Fq 'BOARD_AVB_ENABLE := true' "$COMMON/BoardConfigCommon.mk"
          ! grep -Fq -- '--flags 3' "$COMMON/BoardConfigCommon.mk"
          ! grep -Fq 'vendor/lineage/config/device_framework_matrix.xml' "$COMMON/BoardConfigCommon.mk"

          echo 'AOSP product base invariants: OK'
