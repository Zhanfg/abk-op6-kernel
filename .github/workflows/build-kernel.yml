name: Shared OnePlus 6 Kernel Build

on:
  workflow_call:
    inputs:
      mode:
        description: Build variant
        required: true
        type: string
      kernel_ref:
        description: Kernel source branch or 40-character commit SHA
        required: false
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: oneplus6-${{ inputs.mode }}-${{ inputs.kernel_ref }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_SOURCE: https://github.com/Zhanfg/kernel_oneplus_sdm845
  KERNEL_REF: ${{ inputs.kernel_ref }}
  DEFCONFIG: vendor/enchilada_defconfig
  MODE: ${{ inputs.mode }}
  ANYKERNEL_REPOSITORY: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_COMMIT: 1c9a500dd4aa8081952523126e97eb155aed941b
  MKDTBOIMG_COMMIT: ca53bdb6c8ae5aaa890d4afebe66af55cfd906c8

jobs:
  build:
    name: build-enchilada-4.19-${{ inputs.mode }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 验证构建输入
        shell: bash
        run: |
          set -euo pipefail
          case "${MODE}" in
            Standard|PowerSave) ;;
            *) echo "::error::Unsupported build mode: ${MODE}"; exit 1 ;;
          esac
          test -n "${KERNEL_REF}"

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: 检出构建仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential bc flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            clang lld llvm python3 zip unzip cpio ccache \
            device-tree-compiler libncurses-dev

      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          max-size: 2G
          key: build-enchilada-4.19-${{ inputs.mode }}-${{ inputs.kernel_ref }}

      - name: 固定并检出内核源码
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${KERNEL_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            SOURCE_SHA="${KERNEL_REF}"
          else
            SOURCE_SHA="$(git ls-remote "${KERNEL_SOURCE}.git" "refs/heads/${KERNEL_REF}" | awk '{print $1}')"
          fi
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Unable to resolve kernel source ref: ${KERNEL_REF}"
            exit 1
          }

          rm -rf "${GITHUB_WORKSPACE}/kernel"
          mkdir "${GITHUB_WORKSPACE}/kernel"
          git -C "${GITHUB_WORKSPACE}/kernel" init
          git -C "${GITHUB_WORKSPACE}/kernel" remote add origin "${KERNEL_SOURCE}.git"
          git -C "${GITHUB_WORKSPACE}/kernel" fetch --depth=1 origin "${SOURCE_SHA}"
          git -C "${GITHUB_WORKSPACE}/kernel" checkout --detach FETCH_HEAD
          test "$(git -C "${GITHUB_WORKSPACE}/kernel" rev-parse HEAD)" = "${SOURCE_SHA}"

          SOURCE_EPOCH="$(git -C "${GITHUB_WORKSPACE}/kernel" show -s --format=%ct HEAD)"
          {
            echo "KERNEL_SOURCE_SHA=${SOURCE_SHA}"
            echo "KERNEL_SOURCE_SHORT=${SOURCE_SHA:0:12}"
            echo "SOURCE_DATE_EPOCH=${SOURCE_EPOCH}"
            echo "KERNEL_BUILD_TIMESTAMP=$(date -u -d "@${SOURCE_EPOCH}" '+%Y-%m-%d %H:%M:%S')"
          } >> "${GITHUB_ENV}"

      - name: 验证 ReSukiSU 与 SuSFS 来源
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel"
          BASELINE=RESUKISU_SUSFS_BASELINE.env
          test -s "${BASELINE}"

          while IFS='=' read -r key value; do
            case "${key}" in
              RESUKISU_REPOSITORY|RESUKISU_COMMIT|RESUKISU_TAG|RESUKISU_VERSION_CODE|SUSFS_VERSION|SUSFS_PATCH_REPOSITORY|SUSFS_OLD_4_19_PATCH_COMMIT|SUSFS_NEW_4_19_PATCH_COMMIT|PORT_METHOD|CHECKED_AT_UTC)
                printf '%s=%s\n' "${key}" "${value}" >> "${GITHUB_ENV}"
                ;;
            esac
          done < "${BASELINE}"

          grep -q '^RESUKISU_REPOSITORY=ReSukiSU/ReSukiSU$' "${BASELINE}"
          grep -Eq '^RESUKISU_COMMIT=[0-9a-f]{40}$' "${BASELINE}"
          grep -q '^SUSFS_VERSION=v2.2.0$' "${BASELINE}"
          grep -q '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          test -f drivers/kernelsu/uapi/app_profile.h

      - name: 应用 PowerSave 配置补丁
        if: inputs.mode == 'PowerSave'
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE="${GITHUB_WORKSPACE}/scripts/powersave_defconfig.patch"
          test -s "${PATCH_FILE}"
          patch --directory="${GITHUB_WORKSPACE}/kernel" -p1 < "${PATCH_FILE}"
          grep -E \
            "PM_WAKELOCKS_GC|PM_AUTOSLEEP|WQ_POWER|CPU_BOOST|CPU_FREQ_DEFAULT_GOV|STEP_WISE|ADRENO_TZ" \
            "${GITHUB_WORKSPACE}/kernel/arch/arm64/configs/vendor/enchilada_defconfig"

      - name: 下载固定版本 DTBO 工具
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/K-Blaaaack/mkdtboimg/${MKDTBOIMG_COMMIT}/mkdtboimg.py" \
            --output /tmp/mkdtboimg.py
          python3 -m py_compile /tmp/mkdtboimg.py

      - name: 编译内核与设备树
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel"
          export PATH="/usr/lib/ccache:${PATH}"
          export KBUILD_BUILD_USER=abk
          export KBUILD_BUILD_HOST=github-actions
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_TIMESTAMP="${KERNEL_BUILD_TIMESTAMP}"
          export SOURCE_DATE_EPOCH

          MAKE_ARGS=(
            O=out ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            "CC=ccache clang" LD=ld.lld
            AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            LLVM=1
          )

          make "${MAKE_ARGS[@]}" "${DEFCONFIG}"
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^# CONFIG_KSU_MANUAL_HOOK is not set$' out/.config
          grep -q '^CONFIG_THREAD_INFO_IN_TASK=y$' out/.config

          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" "DTC_FLAGS=-@" Image.gz-dtb dtbs
          test -s out/arch/arm64/boot/Image.gz-dtb

          DTBO_DIR=out/arch/arm64/boot/dts/qcom
          mapfile -t DTBO_FILES < <(
            find "${DTBO_DIR}" -type f \
              \( -name 'enchilada*.dtbo' -o -name 'fajita*.dtbo' -o -name 'sdm845*overlay.dtbo' \) \
              -print | sort
          )
          [ "${#DTBO_FILES[@]}" -gt 0 ] || { echo "::error::No compiled DTBO files found"; exit 1; }
          printf '%s\n' "${DTBO_FILES[@]}" > DTBO_FILES.txt
          python3 /tmp/mkdtboimg.py create dtbo.img "${DTBO_FILES[@]}"
          test -s dtbo.img
          echo "Compiled ${#DTBO_FILES[@]} DTBO overlays"
          ccache --show-stats

      - name: 生成构建来源信息
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel"
          POWERSAVE_PATCH_SHA256=not-applied
          if [ "${MODE}" = PowerSave ]; then
            POWERSAVE_PATCH_SHA256="$(sha256sum "${GITHUB_WORKSPACE}/scripts/powersave_defconfig.patch" | awk '{print $1}')"
          fi

          {
            echo "project=ABK OnePlus 6 Kernel"
            echo "device=OnePlus 6"
            echo "codename=enchilada"
            echo "mode=${MODE}"
            echo "kernel_source=${KERNEL_SOURCE}"
            echo "kernel_ref=${KERNEL_REF}"
            echo "kernel_source_sha=${KERNEL_SOURCE_SHA}"
            echo "resukisu_repository=${RESUKISU_REPOSITORY}"
            echo "resukisu_commit=${RESUKISU_COMMIT}"
            echo "resukisu_tag=${RESUKISU_TAG}"
            echo "resukisu_version_code=${RESUKISU_VERSION_CODE}"
            echo "susfs_version=${SUSFS_VERSION}"
            echo "susfs_patch_repository=${SUSFS_PATCH_REPOSITORY}"
            echo "susfs_old_4_19_patch_commit=${SUSFS_OLD_4_19_PATCH_COMMIT}"
            echo "susfs_new_4_19_patch_commit=${SUSFS_NEW_4_19_PATCH_COMMIT}"
            echo "susfs_port_method=${PORT_METHOD}"
            echo "build_repository=${GITHUB_REPOSITORY}"
            echo "build_repository_sha=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "build_timestamp_utc=${KERNEL_BUILD_TIMESTAMP}"
            echo "clang=$(clang --version | head -n 1)"
            echo "lld=$(ld.lld --version | head -n 1)"
            echo "cross_gcc=$(aarch64-linux-gnu-gcc --version | head -n 1)"
            echo "anykernel_commit=${ANYKERNEL_COMMIT}"
            echo "mkdtboimg_commit=${MKDTBOIMG_COMMIT}"
            echo "mkdtboimg_sha256=$(sha256sum /tmp/mkdtboimg.py | awk '{print $1}')"
            echo "powersave_patch_sha256=${POWERSAVE_PATCH_SHA256}"
            echo "image_gz_dtb_sha256=$(sha256sum out/arch/arm64/boot/Image.gz-dtb | awk '{print $1}')"
            echo "dtbo_img_sha256=$(sha256sum dtbo.img | awk '{print $1}')"
            echo "config_sha256=$(sha256sum out/.config | awk '{print $1}')"
          } > BUILD_INFO.txt

          cp out/.config kernel.config
          sha256sum BUILD_INFO.txt kernel.config DTBO_FILES.txt RESUKISU_SUSFS_BASELINE.env > BUILD_METADATA.sha256

      - name: 打包 AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel"
          rm -rf AnyKernel3
          mkdir AnyKernel3
          git -C AnyKernel3 init
          git -C AnyKernel3 remote add origin "${ANYKERNEL_REPOSITORY}"
          git -C AnyKernel3 fetch --depth=1 origin "${ANYKERNEL_COMMIT}"
          git -C AnyKernel3 checkout --detach FETCH_HEAD
          test "$(git -C AnyKernel3 rev-parse HEAD)" = "${ANYKERNEL_COMMIT}"
          rm -rf AnyKernel3/.git AnyKernel3/.github
          rm -f AnyKernel3/tools/snapshotupdater_static

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          cp dtbo.img AnyKernel3/dtbo.img
          cp BUILD_INFO.txt DTBO_FILES.txt RESUKISU_SUSFS_BASELINE.env AnyKernel3/

          RESUKISU_COMMIT_SHORT="${RESUKISU_COMMIT:0:8}"
          KERNEL_DESC="ABK OnePlus 6 ${MODE} ReSukiSU ${RESUKISU_TAG}+${RESUKISU_COMMIT_SHORT} / SuSFS ${SUSFS_VERSION} (${KERNEL_SOURCE_SHORT})"
          cat > AnyKernel3/anykernel.sh << EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          properties() { '
          kernel.string=${KERNEL_DESC}
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=enchilada
          device.name2=OnePlus6
          device.name3=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          sed -i 's/^          //' AnyKernel3/anykernel.sh

          ZIP_NAME="ABK_OnePlus6_ReSukiSU_SuSFS220_${MODE}_${KERNEL_SOURCE_SHORT}_$(date -u '+%Y%m%d-%H%M').zip"
          (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" .)
          unzip -l "${ZIP_NAME}" | grep -E 'Image.gz-dtb|dtbo.img|anykernel.sh|BUILD_INFO.txt|RESUKISU_SUSFS_BASELINE.env|tools/ak3-core.sh'
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          echo "ARTIFACT_NAME=${ZIP_NAME%.zip}" >> "${GITHUB_ENV}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: 生成构建摘要
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# OnePlus 6 ReSukiSU / SuSFS 2.2 build"
            echo
            echo "- Mode: \`${MODE}\`"
            echo "- Kernel source ref: \`${KERNEL_REF}\`"
            echo "- Kernel source SHA: \`${KERNEL_SOURCE_SHA}\`"
            echo "- ReSukiSU: \`${RESUKISU_TAG}@${RESUKISU_COMMIT}\`"
            echo "- SuSFS: \`${SUSFS_VERSION}\`"
            echo "- Artifact: \`${ZIP_NAME}\`"
            echo "- SHA256: \`$(awk '{print $1}' "${GITHUB_WORKSPACE}/kernel/${ZIP_NAME}.sha256")\`"
            echo
            echo "Build Verified only; Boot and Runtime verification remain required."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 上传 Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            kernel/ABK_OnePlus6_*.zip
            kernel/ABK_OnePlus6_*.zip.sha256
            kernel/BUILD_INFO.txt
            kernel/BUILD_METADATA.sha256
            kernel/DTBO_FILES.txt
            kernel/kernel.config
            kernel/RESUKISU_SUSFS_BASELINE.env
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
